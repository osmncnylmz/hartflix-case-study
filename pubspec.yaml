# Package name stays `sinflix`: the brief's product name, and what the theme
# classes, the assets and the bundle id app.sinflix.sinflix all use. The repo
# it lives in is called hartflix-case-study; see README, "About the name".
name: sinflix
description: >-
  SINFLIX case study: token auth, a swipeable paginated movie feed with
  optimistic favourites, and a profile page with photo upload. Bloc/Cubit,
  GoRouter, get_it + injectable, Dio.
publish_to: 'none'

version: 1.0.0+1

# The floor the committed pubspec.lock resolves to, so constraint and lockfile
# agree. Built and tested on Flutter 3.47.0 / Dart 3.13.0.
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gallery picker for the profile photo upload flow
  image_picker: ^1.2.0

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  go_router: ^16.2.0

  get_it: ^8.2.0
  injectable: ^2.5.1

  dio: ^5.9.0

  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  cached_network_image: ^3.4.1
  google_fonts: ^6.3.0

  # Keychain on iOS, EncryptedSharedPreferences on Android (opt-in, see
  # SecureTokenStore)
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.10.0
  injectable_generator: ^2.8.1

  # Launcher icon / splash screen generation (run manually, not part of CI)
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/sin_flix_logo.png
    - assets/sin_flix_splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/sin_flix_logo.png"

flutter_native_splash:
  color: "#000000"
  image: assets/sin_flix_splash.png
  android: true
  ios: true
  fullscreen: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill
