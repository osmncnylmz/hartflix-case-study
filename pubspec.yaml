# The Dart package name stays `sinflix`: SINFLIX is the product name given in
# the case-study brief, and it is used consistently across the theme classes,
# asset names and the Android/iOS bundle identifiers (app.sinflix.sinflix).
# `hartflix-case-study` is the name of the GitHub repository that hosts it.
# See the "About the name" section of README.md.
name: sinflix
description: >-
  A Flutter case-study app for the SINFLIX brief: token-based auth, a swipeable
  paginated movie feed with optimistic favourites, and a profile page with
  photo upload — built on Bloc/Cubit, GoRouter, get_it/injectable and Dio.
publish_to: 'none'

version: 1.0.0+1

# Matches the floor the committed pubspec.lock resolves to
# (`sdks: dart ">=3.12.0 <4.0.0" / flutter ">=3.44.0"`), so the declared
# constraint and the lockfile agree. Verified on Flutter 3.47.0 / Dart 3.13.0.
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gallery picker for the profile photo upload flow
  image_picker: ^1.2.0

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Routing
  go_router: ^16.2.0

  # Dependency injection
  get_it: ^8.2.0
  injectable: ^2.5.1

  # Networking
  dio: ^5.9.0

  # Code-generated models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI
  cached_network_image: ^3.4.1
  google_fonts: ^6.3.0

  # Secure token storage: iOS Keychain, Android EncryptedSharedPreferences
  # (opted into explicitly in SecureTokenStore; it is not the plugin default)
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.10.0
  injectable_generator: ^2.8.1

  # Launcher icon / splash screen generation (run manually, not part of CI)
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/sin_flix_logo.png
    - assets/sin_flix_splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/sin_flix_logo.png"

flutter_native_splash:
  color: "#000000"
  image: assets/sin_flix_splash.png
  android: true
  ios: true
  fullscreen: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill
