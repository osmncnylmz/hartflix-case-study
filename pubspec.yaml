name: sinflix
description: "SINFLIX"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  flutter_spinkit: ^5.2.2

 
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  
  go_router: ^16.2.0

  
  get_it: ^8.2.0
  injectable: ^2.5.1

 
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  
  infinite_scroll_pagination: ^5.1.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.3.0
  intl: ^0.20.2

 
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.10.0
  injectable_generator: ^2.8.1

  
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/sin_flix_logo.png
    - assets/sin_flix_splash.png   

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/sin_flix_logo.png"

flutter_native_splash:
  color: "#000000"                
  image: assets/sin_flix_splash.png
  android: true
  ios: true
  fullscreen: true

  android_gravity: fill           
  ios_content_mode: scaleAspectFill  